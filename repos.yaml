# stack-workspace — repository manifest
#
# Renamed from rag-workspace on 2026-09-04, following Entscheidung 1 of the vault
# plan `plan-zentrales-dashboard.md`. The old name described what happened to be in
# here first; the workspace is a development coordination layer, not a deployment
# unit, so there is no reason for locally-running and elsewhere-running services to
# be kept apart in it.

system: stack-workspace
description: >
  The repos charlie operates: a local RAG stack, the tools around client work, and
  the single control surface (homebase) that is growing to front all of them.

template:
  url: https://github.com/charlieLucke/python-template.git

defaults:
  owner: charlieLucke
  host: github.com
  branch: main

services:
  - name: titan
    role: RAG engine — ingest (Docling → Late Chunking → BGE-M3) + hybrid search over Qdrant
    consumes: []                       # bottom of the stack; talks only to local infra (Qdrant, GPU)
    exposes: contracts/titan.openapi.yaml
    contract_source: http://127.0.0.1:8765/openapi.json  # live spec to diff for drift
    port: 8765                         # FastAPI, bound 127.0.0.1 (local only by design)

  - name: brain-mcp
    role: Bridge to Claude — MCP server + vault watcher that indexes notes into titan
    consumes: [titan]                  # calls titan POST /search, /ingest/file, etc.
    exposes: contracts/brain-mcp.tools.json
    port: 9100                         # MCP over HTTP, 0.0.0.0 (reached via Tailscale Funnel)

  - name: homebase
    role: >
      The control surface. Today: status, live logs, start/stop of the RAG stack.
      Growing per plan-zentrales-dashboard into the single UI over everything else
      here, with modules switched on by configuration and deployed three times
      (workstation, hub, minecraft host) because the modules need different
      runtime rights.
    consumes: [titan]                  # reads titan GET /health; controls systemd + Qdrant
    exposes: null                      # exposes a human web UI, not consumed by other repos
    port: 9200
    # Renamed from brain-dashboard on 2026-09-04 (Entscheidung 2). The Python package,
    # the BRAIN_DASH_ env prefix and the unit name still say brain-dashboard; those
    # belong to Phase 2, deliberately kept out of the Phase 0 import diff.

  - name: obsidian-inbox-watcher
    role: Document frontend — TXT/PDF/DOCX/URL → Gemini → Markdown note in the vault inbox
    consumes: []                       # produces vault notes; brain-mcp's watcher picks them up
    exposes: null                      # contract is the vault note format (domain frontmatter)
    port: null                         # systemd worker, no HTTP port

  - name: workspace-mcp
    role: Read-only MCP server exposing the workspace (map, routing, contracts, graph) to planning chats
    consumes: []                       # reads workspace files; no runtime dependency on other services
    exposes: contracts/workspace-mcp.tools.json
    port: 9300

  # --- Adopted 2026-09-04, Phase 1 of plan-zentrales-dashboard -------------------
  # These two were always part of what charlie operates; they were outside the
  # workspace only because the workspace was named after the RAG stack.

  - name: meeting-tickets
    role: Recorded client conversations → reviewed ticket drafts → cards on a Planka board
    consumes: []                       # writes to Planka's HTTP API directly (external infra on the hub)
    exposes: null                      # a CLI (`run`, `setup-project`), not a service
    port: null

  - name: planka-mcp
    role: Gives Claude Code one Planka board — view released tickets, claim, work, return for review
    consumes: []                       # reads/moves cards via Planka's HTTP API (external infra on the hub)
    exposes: null                      # serves MCP tools, but no contract file has been extracted yet
    port: 9101                         # behind the same caddy on 8088, served under /planka

# NOT a service here, on purpose: smart-home-dashboard. Entscheidung 0 of the plan
# gives it no repo of its own — its code was imported verbatim into homebase
# (imported/smart-home-dashboard/) and becomes a module there in Phase 2. Adopting
# it as a service would recreate exactly the second owner the plan set out to avoid.
