# Shared ruff config for every service in rag-system.
#
# Child repos keep their own pyproject.toml [tool.ruff] (from the single-repo template);
# this file is the canonical reference they must stay aligned with. If a repo needs to
# deviate, that is a workspace decision (it breaks cross-repo consistency).

line-length = 100
target-version = "py312"
src = ["src", "tests"]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[format]
quote-style = "double"
indent-style = "space"
